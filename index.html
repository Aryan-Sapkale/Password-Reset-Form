
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-box">

            <h1>Change Password</h1>
            <p class="subtitle">Update your password to keep your account secure.</p>

            <form id="passwordForm">
                <!-- Username -->
<div class="input-group">
    <label for="username">Username</label>
    <input type="text" id="username"
           placeholder="Enter your username" required>
    <small class="error" id="usernameError"></small>
</div>

                <!-- Old Password -->
                <div class="input-group">
                    <label for="oldPassword">Old Password</label>
                    <div class="password-box">
                        <input type="password" id="oldPassword"
                               placeholder="Enter old password">
                        <button type="button" class="toggle"
                                data-target="oldPassword">Show</button>
                    </div>
                    <small class="error" id="oldError"></small>
                </div>

                <!-- New Password -->
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-box">
                        <input type="password" id="newPassword"
                               placeholder="Enter new password">
                        <button type="button" class="toggle"
                                data-target="newPassword">Show</button>
                    </div>
                    <small class="error" id="newError"></small>

                    <div class="strength-container">
                        <div class="strength-bar">
                            <div id="strengthFill"></div>
                        </div>
                        <span id="strengthText">Password strength: None</span>
                    </div>

                    <div class="rules">
                        <p id="lengthRule">✗ At least 8 characters</p>
                        <p id="upperRule">✗ One uppercase letter</p>
                        <p id="lowerRule">✗ One lowercase letter</p>
                        <p id="digitRule">✗ One digit</p>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="confirmPassword"
                               placeholder="Confirm new password">
                        <button type="button" class="toggle"
                                data-target="confirmPassword">Show</button>
                    </div>
                    <small class="error" id="confirmError"></small>
                </div>

                <button type="submit" class="submit-btn">
                    Update Password
                </button>

                <p id="message"></p>

            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
